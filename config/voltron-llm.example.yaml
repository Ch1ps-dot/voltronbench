# Copy this file to voltron-llm.yaml and replace the placeholder values.
# The gateway enforces max_concurrency independently for each complete profile.
gateway:
  listen: 0.0.0.0
  port: 8000
  queue_size: 256
  queue_timeout_seconds: 60
  upstream_timeout_seconds: 120
  max_attempts: 2
  rate_limit_cooldown_seconds: 5
  failure_threshold: 3
  circuit_cooldown_seconds: 30
  default_max_concurrency: 8

profiles:
  - name: api-1
    base_url: https://api.example.com/v1
    api_key: sk-key-1
    model: example-model
    max_concurrency: 8
    enabled: true

  - name: api-2
    base_url: https://api.example.com/v1
    api_key: sk-key-2
    model: example-model
    max_concurrency: 8
    enabled: true
